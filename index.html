<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Mi Caja" />
<title>Mi Caja</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f5f0;
    --surface: #ffffff;
    --surface2: #f9f9f7;
    --border: rgba(0,0,0,0.1);
    --text: #1a1a1a;
    --text2: #666;
    --text3: #999;
    --green: #16a34a;
    --green-bg: #dcfce7;
    --red: #dc2626;
    --red-bg: #fee2e2;
    --accent: #2563eb;
    --radius: 14px;
    --radius-sm: 8px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111110;
      --surface: #1c1c1a;
      --surface2: #242422;
      --border: rgba(255,255,255,0.1);
      --text: #f0f0ed;
      --text2: #999;
      --text3: #555;
      --green: #4ade80;
      --green-bg: #14532d44;
      --red: #f87171;
      --red-bg: #7f1d1d44;
      --accent: #60a5fa;
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    padding-bottom: 3rem;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0.875rem 1.25rem;
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 17px; font-weight: 600; }

  .sync-indicator {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    background: var(--surface2);
    color: var(--text3);
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  .sync-indicator.syncing { color: var(--accent); border-color: var(--accent); }
  .sync-indicator.ok      { color: #16a34a;  border-color: #16a34a; }
  .sync-indicator.error   { color: var(--red);    border-color: var(--red); }

  .bienvenida {
    text-align: center;
    padding: 1.5rem 1rem 0.25rem;
  }
  .bienvenida h2 { font-size: 22px; font-weight: 700; }
  .bienvenida p { font-size: 13px; color: var(--text2); margin-top: 4px; text-transform: capitalize; }

  /* Navegador de mes */
  .mes-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.625rem 1.25rem;
    margin-top: 1rem;
  }
  .mes-nav button {
    background: none;
    border: none;
    font-size: 20px;
    color: var(--text2);
    cursor: pointer;
    padding: 4px 8px;
    border-radius: var(--radius-sm);
  }
  .mes-nav button:active { background: var(--surface2); }
  .mes-nav button:disabled { opacity: 0.25; cursor: default; }
  .mes-label { font-size: 15px; font-weight: 600; text-transform: capitalize; }
  .mes-actual-tag {
    font-size: 10px;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 20px;
    padding: 1px 7px;
    margin-left: 6px;
    vertical-align: middle;
  }

  .main { padding: 1rem 1rem 0; max-width: 480px; margin: 0 auto; }

  .disponible-card {
    background: linear-gradient(135deg, var(--accent), #1d4ed8);
    border-radius: var(--radius);
    padding: 1.25rem;
    text-align: center;
    margin-bottom: 0.75rem;
    border: none;
    box-shadow: 0 6px 18px rgba(37,99,235,0.28);
  }
  .disponible-card.negativo {
    background: linear-gradient(135deg, var(--red), #b91c1c);
    box-shadow: 0 6px 18px rgba(220,38,38,0.28);
  }
  .disponible-label { font-size: 11px; color: rgba(255,255,255,0.75); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
  .disponible-amount { font-size: 34px; font-weight: 700; letter-spacing: -1px; color: #fff; }
  .disponible-sub { font-size: 12px; color: rgba(255,255,255,0.85); margin-top: 8px; }
  .disponible-edit-link {
    font-size: 12px; color: #fff; background: none; border: none;
    cursor: pointer; margin-top: 10px; font-family: inherit; text-decoration: underline;
    opacity: 0.9;
  }

  .sueldo-form { display: none; gap: 8px; margin-top: 10px; }
  .sueldo-form.visible { display: flex; }
  .sueldo-form input { flex: 1; }
  .sueldo-form button {
    width: auto; margin-top: 0; padding: 9px 14px; white-space: nowrap;
  }

  .metrics {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 0.75rem;
  }
  .metric {
    background: var(--surface);
    border-radius: var(--radius-sm);
    padding: 0.75rem 0.5rem;
    text-align: center;
    border: 1px solid var(--border);
  }
  .metric-label { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
  .metric-value { font-size: 15px; font-weight: 600; }
  .metric-value.green { color: var(--green); }
  .metric-value.red   { color: var(--red); }

  .tipo-toggle { display: flex; gap: 6px; margin-bottom: 10px; }
  .tipo-btn {
    flex: 1; padding: 9px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text2);
    font-size: 14px; font-weight: 500;
    cursor: pointer; font-family: inherit;
  }
  .tipo-btn.active-ingreso { background: var(--green-bg); color: var(--green); border-color: var(--green); }
  .tipo-btn.active-egreso  { background: var(--red-bg);   color: var(--red);   border-color: var(--red); }

  .section {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    margin-bottom: 0.75rem;
    overflow: hidden;
  }
  .section-header {
    padding: 0.875rem 1rem 0.75rem;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 500;
    color: var(--text2);
  }
  .section-body { padding: 1rem; }

  input[type="text"],
  input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface2);
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    -webkit-appearance: none;
  }
  input:focus { border-color: var(--accent); }

  .row { display: flex; gap: 8px; margin-top: 8px; }
  .row input { flex: 1; }

  .btn-primary {
    width: 100%; margin-top: 10px; padding: 11px;
    border-radius: var(--radius-sm); border: none;
    background: var(--accent); color: #fff;
    font-size: 15px; font-weight: 500;
    cursor: pointer; font-family: inherit;
  }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary:active:not(:disabled) { opacity: 0.85; }

  .btn-ghost {
    background: none; border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 9px 14px;
    color: var(--text2); font-size: 13px;
    cursor: pointer; font-family: inherit;
  }
  .btn-danger { color: var(--red); border-color: var(--red-bg); }

  .error-msg { font-size: 12px; color: var(--red); margin-top: 6px; display: none; }

  .lista-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.875rem 1rem 0.75rem;
    border-bottom: 1px solid var(--border);
  }
  .lista-title { font-size: 13px; font-weight: 500; color: var(--text2); }

  #seccion-lista.colapsada #lista,
  #seccion-lista.colapsada #acciones-lista { display: none; }

  .movimiento {
    display: flex; align-items: center; gap: 10px;
    padding: 0.875rem 1rem;
    border-bottom: 1px solid var(--border);
  }
  .movimiento:last-child { border-bottom: none; }
  .mov-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .mov-dot.ingreso { background: var(--green); }
  .mov-dot.egreso  { background: var(--red); }
  .mov-info { flex: 1; min-width: 0; }
  .mov-desc  { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mov-fecha { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .mov-amount { font-size: 15px; font-weight: 600; flex-shrink: 0; }
  .mov-amount.ingreso { color: var(--green); }
  .mov-amount.egreso  { color: var(--red); }
  .mov-del {
    background: none; border: none; color: var(--text3);
    font-size: 16px; cursor: pointer; padding: 4px 6px; flex-shrink: 0;
  }

  .empty   { text-align: center; padding: 2rem 1rem; color: var(--text3); font-size: 14px; }
  .loading { text-align: center; padding: 2rem 1rem; color: var(--text3); font-size: 14px; }

  .actions {
    display: flex; gap: 8px;
    padding: 0.75rem 1rem;
    border-top: 1px solid var(--border);
  }

  /* Ocultar formulario en meses pasados */
  .readonly-notice {
    background: var(--surface2);
    border-radius: var(--radius-sm);
    padding: 0.75rem 1rem;
    font-size: 13px;
    color: var(--text2);
    text-align: center;
    margin-bottom: 0.75rem;
    border: 1px solid var(--border);
  }
</style>
</head>
<body>

<header>
  <h1>Mi Caja</h1>
  <div class="sync-indicator" id="sync-indicator">Cargando...</div>
</header>

<div class="bienvenida">
  <h2>¡Bienvenido Seba!</h2>
  <p id="fecha-hoy"></p>
</div>

<div class="mes-nav">
  <button id="btn-prev" onclick="cambiarMes(-1)">‹</button>
  <div style="text-align:center;">
    <span class="mes-label" id="mes-label"></span>
    <span class="mes-actual-tag" id="mes-tag" style="display:none;">hoy</span>
  </div>
  <button id="btn-next" onclick="cambiarMes(1)">›</button>
</div>

<div class="main">

  <div class="disponible-card" id="disponible-card">
    <div class="disponible-label">Monto disponible por día</div>
    <div class="disponible-amount" id="disponible-amount">$0</div>
    <div class="disponible-sub" id="disponible-sub"></div>
    <button class="disponible-edit-link" onclick="toggleSueldoForm()">Editar sueldo mensual</button>
    <div class="sueldo-form" id="sueldo-form">
      <input type="number" id="input-sueldo" placeholder="Sueldo mensual" min="0" />
      <button class="btn-primary" onclick="setSueldo()">Guardar</button>
    </div>
  </div>

  <div class="metrics">
    <div class="metric">
      <div class="metric-label">ingresos</div>
      <div class="metric-value green" id="lbl-ingresos">$0</div>
    </div>
    <div class="metric">
      <div class="metric-label">egresos</div>
      <div class="metric-value red" id="lbl-egresos">$0</div>
    </div>
  </div>

  <!-- Solo visible en mes actual -->
  <div id="bloque-formulario">
    <div class="section">
      <div class="section-header">Nuevo movimiento</div>
      <div class="section-body">
        <div class="tipo-toggle">
          <button class="tipo-btn" id="btn-ingreso" onclick="setTipo('ingreso')">+ Ingreso</button>
          <button class="tipo-btn active-egreso" id="btn-egreso" onclick="setTipo('egreso')">− Egreso</button>
        </div>
        <input type="text" id="input-desc" placeholder="Descripción" />
        <div class="row">
          <input type="number" id="input-monto" placeholder="Monto" min="0" />
        </div>
        <p class="error-msg" id="error">Completa todos los campos.</p>
        <button class="btn-primary" id="btn-agregar" onclick="agregar()">Agregar</button>
      </div>
    </div>
  </div>

  <div class="readonly-notice" id="readonly-notice" style="display:none;">
    Vista de solo lectura — los movimientos no se pueden editar en meses pasados.
  </div>

  <div class="loading" id="loading">Conectando con Google Sheets...</div>

  <div class="section" id="seccion-lista" style="display:none;">
    <div class="lista-header">
      <span class="lista-title" id="lista-titulo">Movimientos</span>
      <div style="display:flex; gap:6px; align-items:center;">
        <button class="btn-ghost" style="padding:5px 10px;font-size:12px;" onclick="descargarResumenImagen()">⬇ Imagen</button>
        <button class="btn-ghost" id="btn-toggle-lista" style="padding:5px 10px;font-size:12px;" onclick="toggleLista()">▾</button>
      </div>
    </div>
    <div id="lista"></div>
    <div class="actions" id="acciones-lista">
      <button class="btn-ghost btn-danger" onclick="limpiar()">Borrar mes</button>
    </div>
  </div>

  <p class="empty" id="vacio" style="display:none;">Sin movimientos este mes.</p>

</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxzLSTmN53pMhOr56GIzAeJjhxn_U7e8JOjmebUfk7NrtluBg-O2EFRBhVqcD2B-exE/exec';
const PAYDAY = 28;

const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS  = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

let allData     = [];
let tipo        = 'egreso';
let mesOffset   = 0; // 0 = mes actual, -1 = mes anterior, etc.
let listaAbierta = false;

const ahora = new Date();

function pad(n) { return String(n).padStart(2, '0'); }
function toDateStr(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

const hoyStr = toDateStr(ahora);

document.getElementById('fecha-hoy').textContent =
  `${DIAS[ahora.getDay()]} ${ahora.getDate()} de ${MESES[ahora.getMonth()].toLowerCase()}`;

function getMesActual() {
  const d = new Date(ahora.getFullYear(), ahora.getMonth() + mesOffset, 1);
  return { year: d.getFullYear(), month: d.getMonth(), key: `${d.getFullYear()}-${pad(d.getMonth()+1)}` };
}

function fmt(n) {
  return '$' + Math.round(Math.abs(n)).toLocaleString('es-CL');
}

function fmtFecha(str) {
  if (!str) return '';
  const [y, m, d] = str.split('-');
  return `${parseInt(d)} ${MESES[parseInt(m)-1].toLowerCase().slice(0,3)} ${y}`;
}

function setSync(state) {
  const el = document.getElementById('sync-indicator');
  const map = { syncing:['Sincronizando…','syncing'], ok:['Sincronizado ✓','ok'], error:['Sin conexión','error'] };
  el.textContent = map[state][0];
  el.className = 'sync-indicator ' + map[state][1];
}

function setTipo(t) {
  tipo = t;
  document.getElementById('btn-ingreso').className = 'tipo-btn' + (t==='ingreso'?' active-ingreso':'');
  document.getElementById('btn-egreso').className  = 'tipo-btn' + (t==='egreso' ?' active-egreso':'');
}

function calcMovimientosMes(mesKey) {
  let ingresos = 0, egresos = 0;
  for (const row of allData) {
    if (row[0] === 'INICIAL') continue;
    if (String(row[4]).startsWith(mesKey)) {
      if (row[1] === 'ingreso') ingresos += parseFloat(row[3]) || 0;
      else egresos += parseFloat(row[3]) || 0;
    }
  }
  return { ingresos, egresos, neto: egresos - ingresos };
}

function getSueldo() {
  const row = allData.find(r => r[0] === 'INICIAL' && String(r[4]).trim() === 'SUELDO');
  return row ? (parseFloat(row[5]) || 0) : 0;
}

// Periodo de pago: del día 28 de un mes al 27 del mes siguiente.
function getPeriodoPago() {
  const dia = ahora.getDate();
  let inicio, fin;
  if (dia >= PAYDAY) {
    inicio = new Date(ahora.getFullYear(), ahora.getMonth(), PAYDAY);
    fin    = new Date(ahora.getFullYear(), ahora.getMonth() + 1, PAYDAY - 1);
  } else {
    inicio = new Date(ahora.getFullYear(), ahora.getMonth() - 1, PAYDAY);
    fin    = new Date(ahora.getFullYear(), ahora.getMonth(), PAYDAY - 1);
  }
  return { inicio, fin, inicioStr: toDateStr(inicio), finStr: toDateStr(fin) };
}

function calcNetoPeriodo(inicioStr, finStr) {
  let ingresos = 0, egresos = 0;
  for (const row of allData) {
    if (row[0] === 'INICIAL') continue;
    const f = String(row[4]);
    if (f >= inicioStr && f <= finStr) {
      if (row[1] === 'ingreso') ingresos += parseFloat(row[3]) || 0;
      else egresos += parseFloat(row[3]) || 0;
    }
  }
  return egresos - ingresos;
}

function actualizarDisponible() {
  const sueldo = getSueldo();
  const { fin, inicioStr, finStr } = getPeriodoPago();
  const gastado   = calcNetoPeriodo(inicioStr, finStr);
  const restante  = sueldo - gastado;

  const hoyMed = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate());
  const finMed = new Date(fin.getFullYear(), fin.getMonth(), fin.getDate());
  const diasRestantes = Math.max(1, Math.round((finMed - hoyMed) / 86400000) + 1);
  const porDia = restante / diasRestantes;

  const el      = document.getElementById('disponible-amount');
  const subEl   = document.getElementById('disponible-sub');
  const tarjeta = document.getElementById('disponible-card');

  if (sueldo <= 0) {
    el.textContent = '—';
    tarjeta.classList.remove('negativo');
    subEl.textContent = 'Configura tu sueldo mensual para calcularlo';
  } else {
    el.textContent = fmt(porDia);
    tarjeta.classList.toggle('negativo', porDia < 0);
    subEl.textContent = `${fmt(restante)} disponibles · ${diasRestantes} día${diasRestantes===1?'':'s'} hasta el ${fin.getDate()} ${MESES[fin.getMonth()].toLowerCase().slice(0,3)}`;
  }

  const inputSueldo = document.getElementById('input-sueldo');
  if (document.activeElement !== inputSueldo) {
    inputSueldo.value = sueldo > 0 ? sueldo : '';
  }
}

function toggleSueldoForm() {
  document.getElementById('sueldo-form').classList.toggle('visible');
}

async function setSueldo() {
  const v = parseFloat(document.getElementById('input-sueldo').value);
  if (isNaN(v) || v < 0) return;
  await post({ action: 'set_inicial', mes: 'SUELDO', value: v });
  document.getElementById('sueldo-form').classList.remove('visible');
}

function toggleLista() {
  listaAbierta = !listaAbierta;
  aplicarEstadoLista();
}

function aplicarEstadoLista() {
  document.getElementById('seccion-lista').classList.toggle('colapsada', !listaAbierta);
  document.getElementById('btn-toggle-lista').textContent = listaAbierta ? '▴' : '▾';
}

function cambiarMes(dir) {
  mesOffset += dir;
  if (mesOffset > 0) mesOffset = 0;
  actualizarUI();
}

async function post(payload) {
  setSync('syncing');
  try {
    await fetch(API, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    await cargar();
    setSync('ok');
  } catch(e) { setSync('error'); }
}

async function cargar() {
  try {
    const res  = await fetch(API + '?t=' + Date.now());
    const rows = await res.json();
    allData = rows.slice(1); // quitar encabezados
    actualizarUI();
    setSync('ok');
    document.getElementById('loading').style.display = 'none';
  } catch(e) {
    setSync('error');
    document.getElementById('loading').textContent = 'Error al conectar. Revisa tu conexión.';
  }
}

function actualizarUI() {
  const mes   = getMesActual();
  const esHoy = mesOffset === 0;

  // Etiqueta mes
  document.getElementById('mes-label').textContent = `${MESES[mes.month]} ${mes.year}`;
  document.getElementById('mes-tag').style.display = esHoy ? 'inline' : 'none';
  document.getElementById('btn-next').disabled = esHoy;

  // Formulario solo en mes actual
  document.getElementById('bloque-formulario').style.display = esHoy ? 'block' : 'none';
  document.getElementById('readonly-notice').style.display   = esHoy ? 'none' : 'block';
  document.getElementById('acciones-lista').style.display    = esHoy ? 'flex' : 'none';

  // Ingresos y egresos del mes que se está viendo
  const { ingresos, egresos } = calcMovimientosMes(mes.key);
  document.getElementById('lbl-ingresos').textContent = fmt(ingresos);
  document.getElementById('lbl-egresos').textContent  = fmt(egresos);

  // Monto disponible por día (siempre referido a hoy, independiente del mes que se navega)
  actualizarDisponible();

  // Lista de movimientos del mes: más reciente primero (por fecha y, si empatan, por orden de registro)
  const movs = allData.filter(r => r[0] !== 'INICIAL' && String(r[4]).startsWith(mes.key))
    .sort((a,b) => {
      const porFecha = String(b[4]).localeCompare(String(a[4]));
      if (porFecha !== 0) return porFecha;
      return (parseFloat(b[0]) || 0) - (parseFloat(a[0]) || 0);
    });

  const lista   = document.getElementById('lista');
  const vacio   = document.getElementById('vacio');
  const seccion = document.getElementById('seccion-lista');

  document.getElementById('lista-titulo').textContent = `Movimientos — ${movs.length}`;

  if (movs.length === 0) {
    lista.innerHTML = '';
    vacio.style.display   = 'block';
    seccion.style.display = 'none';
  } else {
    vacio.style.display   = 'none';
    seccion.style.display = 'block';
    lista.innerHTML = movs.map(m => `
      <div class="movimiento">
        <div class="mov-dot ${m[1]}"></div>
        <div class="mov-info">
          <div class="mov-desc">${m[2]}</div>
          <div class="mov-fecha">${fmtFecha(String(m[4]))} · ${m[1]}</div>
        </div>
        <div class="mov-amount ${m[1]}">${m[1]==='ingreso'?'+':'−'}${fmt(parseFloat(m[3]))}</div>
        ${esHoy ? `<button class="mov-del" onclick="eliminar('${m[0]}')">✕</button>` : ''}
      </div>
    `).join('');
    aplicarEstadoLista();
  }
}

async function agregar() {
  const desc  = document.getElementById('input-desc').value.trim();
  const monto = parseFloat(document.getElementById('input-monto').value);
  const err   = document.getElementById('error');

  if (!desc || isNaN(monto) || monto <= 0) { err.style.display = 'block'; return; }
  err.style.display = 'none';

  const btn = document.getElementById('btn-agregar');
  btn.disabled = true; btn.textContent = 'Guardando...';

  document.getElementById('input-desc').value  = '';
  document.getElementById('input-monto').value = '';

  const fecha = toDateStr(new Date());
  await post({ action: 'add', id: Date.now(), tipo, desc, monto, fecha });

  btn.disabled = false; btn.textContent = 'Agregar';
}

async function eliminar(id) {
  await post({ action: 'delete', id });
}

async function limpiar() {
  if (!confirm('¿Borrar todos los movimientos de este mes?')) return;
  await post({ action: 'clear', mes: getMesActual().key });
}

function trazarRectRedondeado(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function descargarResumenImagen() {
  const mes  = getMesActual();
  const { ingresos, egresos } = calcMovimientosMes(mes.key);
  const cantidad = allData.filter(r => r[0] !== 'INICIAL' && String(r[4]).startsWith(mes.key)).length;

  if (cantidad === 0) { alert('No hay movimientos para resumir este mes.'); return; }

  const sueldo = getSueldo();
  const { inicioStr, finStr } = getPeriodoPago();
  const saldoFinal = sueldo - calcNetoPeriodo(inicioStr, finStr);

  const W = 800, H = 572, pad = 40, cardX = pad, cardY = pad, cardW = W - pad * 2, cardH = H - pad * 2;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#f5f5f0';
  ctx.fillRect(0, 0, W, H);

  trazarRectRedondeado(ctx, cardX, cardY, cardW, cardH, 24);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.08)';
  ctx.stroke();

  const left = cardX + 44;
  let y = cardY + 60;

  ctx.fillStyle = '#1a1a1a';
  ctx.font = '600 22px -apple-system, "Segoe UI", sans-serif';
  ctx.fillText('Mi Caja', left, y);

  y += 28;
  ctx.fillStyle = '#666';
  ctx.font = '400 16px -apple-system, "Segoe UI", sans-serif';
  ctx.fillText(`Resumen de ${MESES[mes.month]} ${mes.year}`, left, y);

  y += 80;
  ctx.font = '700 48px -apple-system, "Segoe UI", sans-serif';
  ctx.fillStyle = sueldo > 0 && saldoFinal < 0 ? '#dc2626' : '#16a34a';
  ctx.fillText(sueldo > 0 ? fmt(saldoFinal) : '—', left, y);

  y += 24;
  ctx.font = '400 13px -apple-system, "Segoe UI", sans-serif';
  ctx.fillStyle = '#999';
  ctx.fillText('saldo final del período de pago', left, y);

  const filas = [
    ['Saldo disponible', sueldo > 0 ? fmt(sueldo) : '—', '#2563eb'],
    ['Ingresos', fmt(ingresos), '#16a34a'],
    ['Egresos', fmt(egresos), '#dc2626'],
    ['Movimientos', String(cantidad), '#1a1a1a'],
  ];

  y += 50;
  const rightX = cardX + cardW - 44;
  filas.forEach(([label, valor, color]) => {
    ctx.textAlign = 'left';
    ctx.font = '400 15px -apple-system, "Segoe UI", sans-serif';
    ctx.fillStyle = '#666';
    ctx.fillText(label, left, y);

    ctx.textAlign = 'right';
    ctx.font = '600 18px -apple-system, "Segoe UI", sans-serif';
    ctx.fillStyle = color;
    ctx.fillText(valor, rightX, y);
    ctx.textAlign = 'left';

    y += 38;
  });

  ctx.font = '400 12px -apple-system, "Segoe UI", sans-serif';
  ctx.fillStyle = '#999';
  ctx.fillText(`Generado el ${fmtFecha(hoyStr)}`, left, cardY + cardH - 24);

  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `resumen-${mes.key}.png`;
    a.click();
    URL.revokeObjectURL(url);
  });
}

setTipo('egreso');
cargar();
setInterval(cargar, 30000);

document.getElementById('input-desc').addEventListener('keydown',  e => { if (e.key==='Enter') document.getElementById('input-monto').focus(); });
document.getElementById('input-monto').addEventListener('keydown', e => { if (e.key==='Enter') agregar(); });
document.getElementById('input-sueldo').addEventListener('keydown', e => { if (e.key==='Enter') setSueldo(); });
</script>
